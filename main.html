<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dog Look-Alike</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="main-page">

  <div class="layout">
    <div id="canvas-container"></div>
    <div id="dog-result-box"></div>
  </div>

  <div id="controls">
    <button id="matchBtn" onclick="matchMe()">Match Me</button>
    <button id="diagBtn" onclick="diagnoseFaceData()">🔍 Diagnose</button>
    <select id="modeSelect">
      <option value="weighted">weighted</option>
      <option value="zscore">zscore</option>
      <option value="cosine">cosine</option>
    </select>
    <label><input type="checkbox" id="diversifyCheckbox" /> Diversify by breed</label>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
  <script src="matcher.js"></script>
  <script src="sketch.js"></script>
  <script>
    (function() {
      const modeSelect = document.getElementById('modeSelect');
      const diversifyCheckbox = document.getElementById('diversifyCheckbox');
      window.MATCH_MODE = window.MATCH_MODE || modeSelect.value;
      window.DIVERSIFY = !!window.DIVERSIFY;
      modeSelect.addEventListener('change', (e) => { window.MATCH_MODE = e.target.value; });
      diversifyCheckbox.addEventListener('change', (e) => { window.DIVERSIFY = e.target.checked; });
    })();
  </script>

</body>
</html>
