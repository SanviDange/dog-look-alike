<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dog Feature Extractor - ml5.js FaceMesh</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ml5js/1.3.1/ml5.min.js"></script>
  <style>
    body { 
      font-family: monospace; 
      max-width: 1200px; 
      margin: 20px auto;
      background: #222;
      color: #0f0;
      padding: 20px;
    }
    #status { 
      padding: 10px; 
      background: #333; 
      margin: 10px 0;
      border-left: 3px solid #0f0;
      min-height: 20px;
    }
    #canvas { 
      display: none; 
    }
    #preview {
      width: 200px;
      height: 200px;
      border: 1px solid #0f0;
      margin: 10px 0;
    }
    button {
      background: #0f0;
      color: #000;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      font-weight: bold;
      margin: 10px 5px 10px 0;
    }
    button:hover { background: #00ff00; }
    button:disabled { background: #666; cursor: not-allowed; }
    #progress { margin: 10px 0; }
    .progress-bar {
      width: 100%;
      height: 20px;
      background: #444;
      border: 1px solid #0f0;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      background: #0f0;
      width: 0%;
      transition: width 0.2s;
    }
  </style>
</head>
<body>

<h1>🐕 Dog Feature Extractor (ml5.js FaceMesh)</h1>

<p>Extract facial features from all dog images using the SAME ml5.js model as humans.</p>

<div id="status">Ready to start extraction</div>

<div>
  <button id="startBtn" onclick="startExtraction()">Start Extraction</button>
  <button id="downloadBtn" onclick="downloadResults()" disabled>Download dog_vectors.json</button>
  <button id="resetBtn" onclick="resetExtraction()">Reset</button>
</div>

<div id="progress" style="display:none;">
  <p>Progress: <span id="progressText">0/0</span></p>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
</div>

<canvas id="canvas"></canvas>
<img id="preview" />

<div id="results" style="margin-top: 20px; max-height: 400px; overflow-y: auto; background: #333; padding: 10px; border: 1px solid #0f0;">
  <div id="resultsList"></div>
</div>

<script>
let faceMesh = null;
let extractedDogs = [];
let imageFileNames = [];
let currentIndex = 0;
let isExtracting = false;

const IMAGES_DIR = 'images/'; // Path relative to this HTML file
const FACE_DETECTION_COUNT = 1; // How many times to run detection per image

// Import the feature extraction function from sketch.js
// We'll duplicate it here for the extraction process
function extractFeaturesFromKeypoints(kp) {
  // Face bounding box
  let faceLeft   = kp[234].x;
  let faceRight  = kp[454].x;
  let faceTop    = kp[10].y;
  let faceBottom = kp[152].y;
  let faceWidth  = faceRight - faceLeft;
  let faceHeight = faceBottom - faceTop;
  
  if (faceWidth < 10 || faceHeight < 10) return null;

  // ── LEFT EYE ─────────────────────────────────────────────────
  let leftOuter  = kp[33];
  let leftInner  = kp[133];
  let leftTop    = kp[159];
  let leftBottom = kp[145];
  let leftEyeWidth    = dist(leftOuter.x, leftOuter.y, leftInner.x, leftInner.y);
  let leftEyeH        = dist(leftTop.x, leftTop.y, leftBottom.x, leftBottom.y);
  let leftEyeOpenness = leftEyeH / (leftEyeWidth + 0.0001);

  // ── RIGHT EYE ────────────────────────────────────────────────
  let rightOuter  = kp[362];
  let rightInner  = kp[263];
  let rightTop    = kp[386];
  let rightBottom = kp[374];
  let rightEyeWidth    = dist(rightOuter.x, rightOuter.y, rightInner.x, rightInner.y);
  let rightEyeH        = dist(rightTop.x, rightTop.y, rightBottom.x, rightBottom.y);
  let rightEyeOpenness = rightEyeH / (rightEyeWidth + 0.0001);

  // Eye centers
  let leftEyeCx  = (leftOuter.x  + leftInner.x)  / 2;
  let leftEyeCy  = (leftOuter.y  + leftInner.y)  / 2;
  let rightEyeCx = (rightOuter.x + rightInner.x) / 2;
  let rightEyeCy = (rightOuter.y + rightInner.y) / 2;
  let interocular = dist(leftEyeCx, leftEyeCy, rightEyeCx, rightEyeCy) / faceWidth;

  // ── NOSE ─────────────────────────────────────────────────────
  let noseLeft  = kp[49];
  let noseRight = kp[279];
  let noseTipX  = (noseLeft.x + noseRight.x) / 2;
  let noseTipY  = (noseLeft.y + noseRight.y) / 2;
  let noseWidth = dist(noseLeft.x, noseLeft.y, noseRight.x, noseRight.y) / faceWidth;

  // ── MOUTH ────────────────────────────────────────────────────
  let mouthLeft  = kp[61];
  let mouthRight = kp[291];
  let mouthWidth = dist(mouthLeft.x, mouthLeft.y, mouthRight.x, mouthRight.y) / faceWidth;
  
  let mouthMidX = (mouthLeft.x + mouthRight.x) / 2;
  let mouthMidY = (mouthLeft.y + mouthRight.y) / 2;

  // ── BROWS ────────────────────────────────────────────────────
  let leftBrow  = kp[105];
  let rightBrow = kp[334];
  let leftBrowHeight  = (leftBrow.y  - faceTop) / faceHeight;
  let rightBrowHeight = (rightBrow.y - faceTop) / faceHeight;
  let browWidth = dist(leftBrow.x, leftBrow.y, rightBrow.x, rightBrow.y) / faceWidth;

  // ── STRUCTURAL DERIVED ───────────────────────────────────────
  let noseToMouth = dist(noseTipX, noseTipY, mouthMidX, mouthMidY) / faceHeight;
  let eyesMidX    = (leftEyeCx + rightEyeCx) / 2;
  let eyesMidY    = (leftEyeCy + rightEyeCy) / 2;
  let eyeToNose   = dist(eyesMidX, eyesMidY, noseTipX, noseTipY) / faceHeight;
  let mouthYRatio = (mouthMidY - faceTop) / faceHeight;
  let eyeYRatio   = (eyesMidY  - faceTop) / faceHeight;

  let noseToMouthWidth = noseWidth / (mouthWidth + 0.0001);
  let avgEyeWidth      = (leftEyeWidth / faceWidth + rightEyeWidth / faceWidth) / 2;
  let eyeSpacingRatio  = avgEyeWidth / (interocular + 0.0001);

  let browToEyeLeft  = Math.abs(leftBrow.y  - leftEyeCy)  / faceHeight;
  let browToEyeRight = Math.abs(rightBrow.y - rightEyeCy) / faceHeight;
  let browToEye      = (browToEyeLeft + browToEyeRight) / 2;

  // ── EXPRESSION FEATURES ──────────────────────────────────────

  // Inner mouth opening (most sensitive to mouth open/close)
  let innerMouthOpen = 0;
  if (kp[13] && kp[14]) {
    innerMouthOpen = dist(kp[13].x, kp[13].y, kp[14].x, kp[14].y) / faceHeight;
  } else {
    innerMouthOpen = 0.01;
  }

  // Outer mouth opening
  let mouthOpen = dist(kp[0].x, kp[0].y, kp[17].x, kp[17].y) / faceHeight;

  // Mouth corner raise
  let cornerAvgY = (mouthLeft.y + mouthRight.y) / 2;
  let mouthCornerRaise = (mouthMidY - cornerAvgY) / faceHeight;

  // Brow raise
  let leftBrowRaise  = (leftEyeCy  - leftBrow.y)  / faceHeight;
  let rightBrowRaise = (rightEyeCy - rightBrow.y) / faceHeight;
  let browRaise      = (leftBrowRaise + rightBrowRaise) / 2;

  // Eye squeeze
  let leftEyeSqueeze  = leftEyeH  / faceHeight;
  let rightEyeSqueeze = rightEyeH / faceHeight;

  // ── 23-FEATURE VECTOR ────────────────────────────────────────
  return [
    leftEyeWidth    / faceWidth,   // 0  L eye width / face width
    rightEyeWidth   / faceWidth,   // 1  R eye width / face width
    leftEyeOpenness,               // 2  L eye openness
    rightEyeOpenness,              // 3  R eye openness
    interocular,                   // 4  interocular / face width
    noseWidth,                     // 5  nose width / face width
    mouthWidth,                    // 6  mouth width / face width
    faceHeight / faceWidth,        // 7  face roundness
    leftBrowHeight,                // 8  L brow height / face height
    rightBrowHeight,               // 9  R brow height / face height
    browWidth,                     // 10 brow width / face width
    noseToMouth,                   // 11 nose-to-mouth / face height
    eyeToNose,                     // 12 eye-to-nose / face height
    mouthYRatio,                   // 13 mouth Y pos / face height
    eyeYRatio,                     // 14 eye Y pos / face height
    noseToMouthWidth,              // 15 nose width / mouth width
    eyeSpacingRatio,               // 16 avg eye width / interocular
    browToEye,                     // 17 brow-to-eye gap / face height
    mouthOpen,                     // 18 outer mouth openness
    innerMouthOpen,                // 19 inner mouth opening
    mouthCornerRaise,              // 20 mouth corner raise
    browRaise,                     // 21 brow raise / face height
    leftEyeSqueeze,                // 22 L eye squeeze / face height
  ];
}

function dist(x1, y1, x2, y2) {
  return Math.sqrt((x2-x1)**2 + (y2-y1)**2);
}

async function initFaceMesh() {
  return new Promise((resolve) => {
    faceMesh = ml5.faceMesh({}, () => {
      updateStatus('✓ FaceMesh model loaded');
      resolve();
    });
  });
}

function updateStatus(msg) {
  document.getElementById('status').textContent = msg;
  console.log(msg);
}

function updateProgress(current, total) {
  const pct = Math.round((current / total) * 100);
  document.getElementById('progressText').textContent = `${current}/${total}`;
  document.getElementById('progressFill').style.width = pct + '%';
}

async function processImage(imagePath, filename) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = async () => {
      const canvas = document.getElementById('canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      
      // Show preview
      document.getElementById('preview').src = imagePath;
      
      // Run face detection
      faceMesh.detectStart(canvas, async (results) => {
        if (results && results.length > 0) {
          const face = results[0];
          const features = extractFeaturesFromKeypoints(face.keypoints);
          
          if (features) {
            const vector = features.map(f => Math.round(f * 10000) / 10000);
            extractedDogs.push({
              image: filename,
              vector: vector
            });
            updateStatus(`✓ Extracted: ${filename} (${extractedDogs.length})`);
          } else {
            updateStatus(`✗ Feature extraction failed: ${filename}`);
          }
        } else {
          updateStatus(`⚠ No face detected: ${filename}`);
        }
        
        faceMesh.detectStop();
        setTimeout(resolve, 100);
      });
    };
    img.onerror = () => {
      updateStatus(`✗ Failed to load image: ${filename}`);
      setTimeout(resolve, 100);
    };
    img.src = imagePath;
  });
}

async function startExtraction() {
  if (isExtracting) return;
  isExtracting = true;
  
  document.getElementById('startBtn').disabled = true;
  document.getElementById('resetBtn').disabled = true;
  document.getElementById('progress').style.display = 'block';
  extractedDogs = [];
  
  updateStatus('Initializing FaceMesh...');
  await initFaceMesh();
  
  updateStatus('Scanning images directory...');
  // In a real setup, you'd need to list files from the images/ directory
  // For now, we'll use a hardcoded list or fetch from server
  
  // Get list of images from the directory
  // This requires server-side support or a specific file listing
  const imageFiles = [
    // These would be populated from the server
    // For demonstration, showing the process
  ];
  
  // Alternative: Ask user to upload the list or use a worker
  updateStatus('Note: This requires a backend to list image files. Showing extraction process...');
  updateStatus('Ready for batch extraction (backend integration needed)');
  
  isExtracting = false;
  document.getElementById('startBtn').disabled = false;
  document.getElementById('resetBtn').disabled = false;
}

function downloadResults() {
  if (extractedDogs.length === 0) {
    alert('No features extracted yet');
    return;
  }
  
  const dataStr = JSON.stringify(extractedDogs, null, 2);
  const dataBlob = new Blob([dataStr], {type: 'application/json'});
  const url = URL.createObjectURL(dataBlob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'dog_vectors.json';
  link.click();
  URL.revokeObjectURL(url);
  
  updateStatus(`✓ Downloaded ${extractedDogs.length} dog feature vectors`);
}

function resetExtraction() {
  extractedDogs = [];
  currentIndex = 0;
  isExtracting = false;
  document.getElementById('startBtn').disabled = false;
  document.getElementById('resetBtn').disabled = false;
  document.getElementById('progress').style.display = 'none';
  document.getElementById('resultsList').innerHTML = '';
  updateStatus('Reset. Ready to start extraction');
}

// Initialize on load
window.addEventListener('load', () => {
  updateStatus('Page loaded. Click "Start Extraction" to begin.');
});
</script>

</body>
</html>
